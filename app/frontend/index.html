<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Groundwork tickets</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">AWS Groundwork</p>
        <h1>Ticket desk</h1>
        <p class="intro">Submit a ticket or read the latest tickets from the database.</p>
      </header>

      <section class="panel" aria-labelledby="submit-heading">
        <h2 id="submit-heading">Submit a ticket</h2>
        <form id="ticket-form">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            maxlength="255"
            autocomplete="email"
            required
          />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" maxlength="5000" required></textarea>

          <button id="submit-button" type="submit">Submit ticket</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="tickets-heading">
        <div class="section-heading">
          <div>
            <h2 id="tickets-heading">Recent tickets</h2>
            <p class="helper">Email addresses are masked by the API.</p>
          </div>
          <button id="read-button" class="button-secondary" type="button">Read database</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="tickets" class="tickets">
          <p class="empty-state">Choose “Read database” to load tickets.</p>
        </div>
      </section>
    </main>
  </body>
</html>
